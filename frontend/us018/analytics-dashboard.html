<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workflow Analytics Dashboard</title>
  <link rel="stylesheet" href="./analytics-dashboard.css">
</head>
<body>
  <header class="page-head">
    <h1>Workflow Analytics</h1>
    <p>Approval, conversion, and latency metrics for orchestration runs.</p>
  </header>

  <main class="layout" aria-label="Workflow analytics dashboard">
    <section class="card controls">
      <button id="refresh-button" type="button">Refresh Metrics</button>
      <p id="status-line" role="status" aria-live="polite">Click refresh to load analytics.</p>
    </section>

    <section class="card" aria-labelledby="widgets-title">
      <h2 id="widgets-title">Dashboard Widgets</h2>
      <div id="widget-grid" class="widget-grid" data-testid="widget-grid"></div>
    </section>

    <section class="card" aria-labelledby="detail-title">
      <h2 id="detail-title">Metric Details</h2>
      <dl class="detail-grid" data-testid="detail-grid">
        <div><dt>Total Runs</dt><dd id="total-runs">0</dd></div>
        <div><dt>Decided Runs</dt><dd id="decided-runs">0</dd></div>
        <div><dt>Approved Runs</dt><dd id="approved-runs">0</dd></div>
        <div><dt>Rejected Runs</dt><dd id="rejected-runs">0</dd></div>
        <div><dt>Generated Tasks</dt><dd id="tasks-generated-runs">0</dd></div>
        <div><dt>Avg Task Generation Latency (s)</dt><dd id="avg-task-generation-latency">0.00</dd></div>
      </dl>
    </section>
  </main>

  <script type="module" src="./analytics-dashboard.js"></script>
</body>
</html>
